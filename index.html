    <script>
      (function() {
        try {
          var isDeleted = localStorage.getItem('jjf_thumb_permanently_deleted') === 'true';
          var customThumb = !isDeleted ? localStorage.getItem('jjf_custom_thumbnail') : null;
          if (!customThumb && !isDeleted) {
            var raw = localStorage.getItem('jjf_home_content');
            if (raw) {
              var parsed = JSON.parse(raw);
              if (parsed && parsed.appThumbnailUrl && parsed.appThumbnailUrl !== '/pwa-icon-512.png') {
                customThumb = parsed.appThumbnailUrl;
              }
            }
          }
          if (customThumb && (customThumb.indexOf('1791445209912') !== -1 || customThumb.indexOf('1791445272050') !== -1)) {
            customThumb = null;
            try { localStorage.removeItem('jjf_custom_thumbnail'); } catch(e) {}
          }
          if (customThumb && customThumb.trim()) {
            var t = customThumb.trim();
            var icons = document.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"]');
            icons.forEach(function(el) { el.setAttribute('href', t); });
            var og = document.querySelector('meta[property="og:image"]');
            if (og) og.setAttribute('content', t);
            var tw = document.querySelector('meta[name="twitter:image"]');
            if (tw) tw.setAttribute('content', t);
            try {
              fetch('/api/app-thumbnail', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ thumbnailUrl: t })
              }).catch(function() {});
            } catch(e) {}
          }
        } catch(e) {}
      })();
    </script>
